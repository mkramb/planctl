version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
    - revive
    - testifylint
  settings:
    revive:
      rules:
        # planctl is an application with no public Go API; everything lives under
        # internal/, so mandatory doc-comments on exported symbols add noise.
        - name: exported
          disabled: true
    misspell:
      locale: US

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
