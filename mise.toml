[tools]
go = "1.27.1"
golangci-lint = "2.14.0"

[tasks.build]
description = "Build the planctl binary"
run = "go build -o bin/planctl ./cmd/planctl"

[tasks.fmt]
description = "Format Go sources"
run = "go fmt ./..."

[tasks.vet]
description = "Run Go static analysis"
run = "go vet -tags integration ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run --build-tags integration"

[tasks.validate]
description = "Format, vet, and lint"
depends = ["fmt", "vet", "lint"]

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks.test-integration]
description = "Run integration tests (real Git + in-memory GitHub; live gh tests skip without PLANCTL_GH_TEST_REPO)"
run = "go test -tags integration ./..."
