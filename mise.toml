[tools]
go = "1.27.1"

[tasks.build]
description = "Build the planctl binary"
run = "go build -o bin/planctl ./cmd/planctl"

[tasks.test]
description = "Run all offline tests (requires Git)"
run = "go test ./..."

[tasks.test-integration]
description = "Run CLI integration tests with real Git"
run = "go test ./test/integration/..."

[tasks.fmt]
description = "Format Go sources"
run = "go fmt ./..."

[tasks.vet]
description = "Run Go static analysis"
run = "go vet ./..."
