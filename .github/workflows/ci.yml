name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2026.5.15
      - name: Validate (fmt, vet, lint)
        run: mise run validate
      - name: Check formatting
        run: git diff --exit-code
      - name: Test
        run: mise run test
      - name: Build
        run: mise run build
